name: Generate OG preview image once

on:
  push:
    branches:
      - feat/og-logo-white-20261019

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Compose centered MYROCK logo on white
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Image.open('src/logo-transparent.png').convert('RGBA')
          box = source.getchannel('A').getbbox()
          if box is None:
              raise RuntimeError('Source logo is fully transparent')
          logo = source.crop(box)
          original_width, original_height = logo.size
          scale = min(640 / original_width, 410 / original_height)
          new_size = (max(1, round(original_width * scale)), max(1, round(original_height * scale)))
          logo = logo.resize(new_size, Image.Resampling.LANCZOS)
          canvas = Image.new('RGB', (1200, 630), '#ffffff')
          x = (1200 - logo.width) // 2
          y = (630 - logo.height) // 2
          canvas.paste(logo, (x,y), logo.getchannel('A'))
          Path('public').mkdir(exist_ok=True)
          canvas.save('public/og-image.png', format='PNG', optimize=True)
          print(f'Original {source.size}; visible {original_width}x{original_height}; output logo {logo.size}; image 1200x630.')
          PY
      - name: Commit generated binary and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/og-image.png
          git rm .github/workflows/generate-og-image-once.yml
          git commit -m "feat: add white-background centered MYROCK Open Graph image"
          git push origin HEAD:feat/og-logo-white-20261019
