name: Check Cloudflare Pages website and admin API

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build website
        run: npm run build
      - name: Test Pages API
        run: npm run check:api
      - name: Compile Cloudflare Pages Functions
        run: npm run check:pages
